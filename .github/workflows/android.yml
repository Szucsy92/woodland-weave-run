name: Build APK and IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ts: ${{ steps.v.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Unique, human-readable stamp for every build: 2026-10-22_08-46
      - id: v
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%d_%H-%M)" >> "$GITHUB_OUTPUT"

  android:
    needs: meta
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Capacitor CLI requires Node >= 22; the runner default is older.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Never publish a temporary debug signature: it breaks in-place updates.
      - name: Prepare permanent release signing
        run: bash scripts/prepare-android-signing.sh

      - name: Install dependencies
        run: npm install

      - name: Build the static web bundle
        run: npm run build

      - name: Verify the bundle has an index.html
        run: test -f dist/index.html || (echo "dist/index.html missing" && exit 1)

      - name: Sync the bundle into the Android app
        run: npx --no-install cap sync android

      # Keep the downloaded Gradle between runs so GitHub hiccups (HTTP 504) hit only once.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # The Gradle download can fail with a temporary 504: retry a few times.
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew assembleRelease \
                -PciVersionCode=${{ github.run_number }} \
                -PciVersionName=${{ needs.meta.outputs.version }}; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Verify APK signature matches the permanent key
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk-certificates.txt
          cat /tmp/apk-certificates.txt
          ACTUAL=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apk-certificates.txt | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL"
          test "$ACTUAL" = "$ANDROID_SIGNING_SHA256"

      # Give every APK a unique, dated name so downloads never overwrite each other.
      - name: Rename APK with the build timestamp
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/woodland-weave-run-${{ needs.meta.outputs.ts }}.apk"
          ls apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: apk-out/*.apk

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/release.keystore

  ios:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @capacitor/ios@^8.5.3

      - name: Build the static web bundle
        run: npm run build

      - name: Create and sync the iOS project
        run: |
          npx --no-install cap add ios
          npx --no-install cap sync ios

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload ipa-out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "ipa-out/woodland-weave-run-${{ needs.meta.outputs.ts }}-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: woodland-weave-run-ipa
          path: ipa-out/*.ipa

  # One release for both files. A failed iOS build never blocks the Android update:
  # the in-app updater only looks for the .apk in the latest release.
  release:
    needs: [meta, android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: out

      - name: Download IPA
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: woodland-weave-run-ipa
          path: out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.ts }}-build${{ github.run_number }}
          name: Woodland Weave Run – ${{ needs.meta.outputs.ts }} (build ${{ github.run_number }})
          files: out/*
          generate_release_notes: true
