name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the static web bundle
        run: bun run build

      - name: Sync the bundle into the Android app
        run: bunx cap sync android

      - name: Decode release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Read version from package.json
        id: version
        run: echo "name=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=${{ steps.version.outputs.name }} \
            -PRELEASE_STORE_FILE=app/release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build debug APK (fallback when no keystore is configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: ./gradlew assembleDebug -PciVersionCode=${{ github.run_number }} -PciVersionName=${{ steps.version.outputs.name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
