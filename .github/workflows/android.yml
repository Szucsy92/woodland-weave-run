name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Capacitor CLI requires Node >= 22; the runner default is older.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub ubuntu runner ships the Android SDK preinstalled (ANDROID_HOME).

      - name: Install dependencies
        run: bun install

      - name: Build the static web bundle
        run: bun run build

      # Outside the Lovable sandbox nitro writes the static site to .output/public;
      # Capacitor reads dist/client, so normalise the location.
      - name: Move the static bundle to dist/client
        run: |
          if [ ! -f dist/client/index.html ] && [ -f .output/public/index.html ]; then
            rm -rf dist/client
            mkdir -p dist
            cp -r .output/public dist/client
          fi

      - name: Verify the bundle has an index.html
        run: test -f dist/client/index.html || (echo "dist/client/index.html missing" && ls -R dist .output 2>/dev/null | head -50 && exit 1)

      - name: Sync the bundle into the Android app
        run: npx --no-install cap sync android

      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Read version from package.json
        id: version
        run: echo "name=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # Unique, human-readable stamp for every build: 2026-10-22_08-46
      - name: Build timestamp
        id: stamp
        run: echo "ts=$(date -u +%Y-%m-%d_%H-%M)" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=${{ steps.version.outputs.name }} \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PRELEASE_KEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PRELEASE_KEY_PASSWORD='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Build debug APK (fallback when no keystore is configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PciVersionCode=${{ github.run_number }} -PciVersionName=${{ steps.version.outputs.name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          name: Woodland Weave Run v${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
