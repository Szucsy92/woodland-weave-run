name: Build APK

on:
  push:
    branches: [main]
  # The "Run workflow" button on the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ts: ${{ steps.v.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      # Unique, human-readable stamp for every build: 2026-10-22_08-46
      - id: v
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%d_%H-%M)" >> "$GITHUB_OUTPUT"

  # Reports problems early but never blocks the APK: a red test must not strand an update.
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Unit tests (parity with the original game logic, updater)
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew testDebugUnitTest; then exit 0; fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

  android:
    needs: meta
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Never publish a temporary debug signature: it breaks in-place updates.
      - name: Prepare permanent release signing
        run: bash scripts/prepare-android-signing.sh

      # Keep the downloaded Gradle between runs so GitHub hiccups (HTTP 504) hit only once.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          # The Gradle download can fail with a temporary 504: retry a few times.
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew assembleRelease \
                -PciVersionCode=${{ github.run_number }} \
                -PciVersionName=${{ needs.meta.outputs.version }}; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Verify APK signature matches the permanent key
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk-certificates.txt
          cat /tmp/apk-certificates.txt
          ACTUAL=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apk-certificates.txt | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL"
          test "$ACTUAL" = "$ANDROID_SIGNING_SHA256"

      # Give every APK a unique, dated name so downloads never overwrite each other.
      - name: Rename APK with the build timestamp
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/release/app-release.apk "apk-out/woodland-weave-run-${{ needs.meta.outputs.ts }}.apk"
          ls apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: apk-out/*.apk

      - name: Remove signing key from runner
        if: always()
        run: rm -f app/release.keystore

  # The in-app updater looks for the .apk in the latest release.
  release:
    needs: [meta, android]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.ts }}-build${{ github.run_number }}
          name: Woodland Weave Run – ${{ needs.meta.outputs.ts }} (build ${{ github.run_number }})
          files: out/*
          generate_release_notes: true
