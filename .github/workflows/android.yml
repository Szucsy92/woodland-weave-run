name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Capacitor CLI requires Node >= 22; the runner default is older.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Never publish a temporary debug signature: it breaks in-place updates.
      - name: Prepare permanent release signing
        run: bash scripts/prepare-android-signing.sh

      # The GitHub ubuntu runner ships the Android SDK preinstalled (ANDROID_HOME).

      - name: Install dependencies
        run: bun install

      - name: Build the static web bundle
        run: bun run build

      # Outside the Lovable sandbox nitro writes the static site to .output/public;
      # Capacitor reads dist/client, so normalise the location.
      - name: Move the static bundle to dist/client
        run: |
          if [ ! -f dist/client/index.html ] && [ -f .output/public/index.html ]; then
            rm -rf dist/client
            mkdir -p dist
            cp -r .output/public dist/client
          fi

      - name: Verify the bundle has an index.html
        run: test -f dist/client/index.html || (echo "dist/client/index.html missing" && ls -R dist .output 2>/dev/null | head -50 && exit 1)

      - name: Sync the bundle into the Android app
        run: npx --no-install cap sync android

      - name: Read version from package.json
        id: version
        run: echo "name=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # Unique, human-readable stamp for every build: 2026-10-22_08-46
      - name: Build timestamp
        id: stamp
        run: echo "ts=$(date -u +%Y-%m-%d_%H-%M)" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=${{ steps.version.outputs.name }}

      - name: Verify APK signature matches the permanent key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "$ANDROID_SIGNING_SHA256"

      # Give every APK a unique, dated name so downloads never overwrite each other.
      - name: Rename APK with the build timestamp
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/woodland-weave-run-${{ steps.stamp.outputs.ts }}.apk"
          ls apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woodland-weave-run-apk
          path: apk-out/*.apk

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ steps.stamp.outputs.ts }}-build${{ github.run_number }}
          name: Woodland Weave Run – ${{ steps.stamp.outputs.ts }} (build ${{ github.run_number }})
          files: apk-out/*.apk
          generate_release_notes: true

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/release.keystore
